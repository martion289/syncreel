<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — SyncReel</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #07080a;
        color: #f5f7fa;
        font-family: system-ui, -apple-system, sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 400px;
        background: #101216;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 24px;
        text-align: center;
      }
      h1 {
        font-size: 1.15rem;
        margin: 0 0 8px;
        letter-spacing: -0.01em;
      }
      p {
        color: #98a0b0;
        font-size: 0.92rem;
        line-height: 1.5;
        margin: 0 0 18px;
      }
      button {
        background: #f5f7fa;
        color: #07080a;
        border: none;
        border-radius: 10px;
        padding: 10px 18px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>SyncReel needs a connection to your home server to sync playback and stream video.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
